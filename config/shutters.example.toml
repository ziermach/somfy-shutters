# Copy to config/shutters.toml and edit. The real file is gitignored: it holds
# the RTS addresses of actual motors, and this repository is public.

[general]
# An estimate older than this is shown de-emphasised, with a resync offered (FR-008).
stale_after_hours = 12
# Used for a shutter whose travel time has not been measured yet (FR-015).
# It still animates; the interface marks it as not calibrated.
default_travel_seconds = 20
# The wall clock automations follow, as a zoneinfo name. Stated here rather than
# taken from the operating system, so a reinstall cannot shift every rule.
timezone = "Europe/Berlin"

# Where the house is, for sunrise and sunset rules. Optional: it can be set in the
# app instead, and once it has been, the app's value wins over this one.
# [location]
# latitude = 52.52
# longitude = 13.40

[bridge]
# "sim" runs a simulated house and needs no broker — this is how the app is
# developed. "mqtt" talks to Pi-Somfy through Mosquitto.
kind = "sim"
host = "localhost"
port = 1883
# user = "somfy"
# password = "..."

# Direction needs no setting: Pi-Somfy (v3.1 and later) declares 100 = fully open and
# 0 = fully closed, which is what this app uses. An old `invert_level` line is ignored.

# Who may talk to the app (feature 007). Every phone gets its own credential by
# pairing; the first one comes from running `somfy-shutters auth recover` on the Pi.
# Left out, `mode` is "open" with the simulator and "required" with a real bridge;
# "open" with bridge.kind = "mqtt" refuses to start.
[auth]
# mode = "required"
failed_attempts = 10          # failed logins from one address …
failed_window_minutes = 5     # … within this window …
lockout_minutes = 15          # … lock that address out for this long
command_burst = 10            # commands one device may send in a burst …
command_per_second = 1.0      # … refilled at this rate
pairing_minutes = 5           # how long a pairing code lasts
audit_retention_days = 180    # how long the record of who did what is kept
# trusted_proxy = "127.0.0.1" # only then is X-Forwarded-For believed

# One block per shutter. The address is the RTS address Pi-Somfy assigned, copied
# by hand from its operateShutters.conf. We deliberately do not read that file:
# see specs/001-mqtt-live-position/research.md, section 5.
[[shutter]]
id = "wohnzimmer"
name = "Wohnzimmer"
address = "0x279621"
travel_up_seconds = 18.2
travel_down_seconds = 16.1

[[shutter]]
id = "kueche"
name = "Küche"
address = "0x279622"
travel_up_seconds = 12.4
# travel_down_seconds not measured yet — falls back to default_travel_seconds

[[shutter]]
id = "schlafzimmer"
name = "Schlafzimmer"
address = "0x279623"
# neither direction measured

[[shutter]]
id = "buero"
name = "Büro"
address = "0x279624"
travel_up_seconds = 13.0
travel_down_seconds = 11.8
