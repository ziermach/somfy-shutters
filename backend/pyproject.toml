[project]
name = "somfy-shutters"
version = "0.1.0"
description = "Self-hosted control for SIMU/Somfy RTS roller shutters through Pi-Somfy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiomqtt>=2.5,<3",
    "pydantic>=2.9",
    "APScheduler>=3.11,<4",
    "astral>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "httpx2>=0.1",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/somfy_shutters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Raised inside starlette's TestClient via anyio; not ours to fix, and we
    # still want every other warning to fail the run.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
